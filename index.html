:root {

  --fg: #3A2A1E;
  --muted: #8A7868;
  --line: #D9E8E0;
  --surface: #FFFFFF;
  --accent: #5B4A9B;
  --accent-soft: #E5DFF6;

  --a-bg: #FBE3E1; --a-ink: #A32A22;
  --c-bg: #DCEAF8; --c-ink: #1F4F8A;
  --d-bg: #DDEBDD; --d-ink: #1E5B35;
  --o-bg: #E6E0F5; --o-ink: #4B3A9A;
  --f-bg: #FCEBCB; --f-ink: #8A5A10;
  --g-bg: #D9ECEF; --g-ink: #1B6470;
  --t-bg: #F9DFE4; --t-ink: #A3304A;
  --s-bg: #E3E4F7; --s-ink: #3B46A0;

  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

}

    --accent: #CFC3FA; --accent-soft: #3A3358;
    --a-bg: #4A2A29; --a-ink: #FFB4AC;
    --c-bg: #22364D; --c-ink: #A9CDF5;
    --d-bg: #26402E; --d-ink: #A9DDB5;
    --o-bg: #3A3358; --o-ink: #CFC3FA;
    --f-bg: #4A3A1C; --f-ink: #F3CD84;
    --g-bg: #1F3F44; --g-ink: #9ADAE4;
    --t-bg: #4A2A34; --t-ink: #F6B2C4;
    --s-bg: #2D3052; --s-ink: #BFC4F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --a-bg: #4A2A29; --a-ink: #FFB4AC;
  --c-bg: #22364D; --c-ink: #A9CDF5;
  --d-bg: #26402E; --d-ink: #A9DDB5;

  --t-bg: #4A2A34; --t-ink: #F6B2C4;
  --s-bg: #2D3052; --s-ink: #BFC4F5;

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin: 0 auto; min-width: 0; }

.l-A { background: var(--a-bg); color: var(--a-ink); }
.l-C { background: var(--c-bg); color: var(--c-ink); }
.l-D { background: var(--d-bg); color: var(--d-ink); }
.l-O { background: var(--o-bg); color: var(--o-ink); }
.l-F { background: var(--f-bg); color: var(--f-ink); }
.l-G { background: var(--g-bg); color: var(--g-ink); }
.l-T { background: var(--t-bg); color: var(--t-ink); }
.l-S { background: var(--s-bg); color: var(--s-ink); }

.tag {
  display: inline-block;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-display);
  font-size: 15px;
  padding: 2px 14px;
  border-radius: 8px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(38px, 11vw, 52px);
  line-height: 1.15;
  margin: 14px 0 6px;
  text-wrap: balance;
}
.sub {
  font-family: var(--font-display);
  color: var(--accent);
  font-size: 21px;
  margin: 0;
}

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn-main {
  background: var(--accent);
  color: var(--bg);
  border: 0;
  border-radius: 14px;
  padding: 14px 26px;
  font-family: var(--font-display);
  font-size: 20px;
  width: 100%;
}
.btn-ghost {
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 15px;
  color: var(--muted);
}
.btn-ghost[disabled] { visibility: hidden; }

/* 시작 화면 */
.intro { display: flex; flex-direction: column; gap: 22px; margin-top: 28px; }
.axes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.axis-card {
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.axis-card b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.axis-card span { font-size: 14px; opacity: .85; }
.axis-card.ax1 { background: var(--a-bg); color: var(--a-ink); }
.axis-card.ax2 { background: var(--d-bg); color: var(--d-ink); }
.axis-card.ax3 { background: var(--f-bg); color: var(--f-ink); }
.axis-card.ax4 { background: var(--t-bg); color: var(--t-ink); }
.note { color: var(--muted); font-size: 15px; margin: 0; text-align: center; }

/* 문항 화면 */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
.count { font-family: var(--font-display); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.axis-label {
  display: inline-block;
  font-size: 14px;
  padding: 2px 12px;
  border-radius: 99px;
  margin-top: 28px;
}
.q {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(25px, 7vw, 30px);
  line-height: 1.35;
  margin: 10px 0 22px;
  text-wrap: balance;
}
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt {
  border: 2.5px solid transparent;
  border-radius: 20px;
  padding: 22px 20px;
  text-align: left;
  font-size: 18px;
  line-height: 1.5;
  color: var(--fg);
  min-height: 84px;
  display: flex;
  align-items: center;
  transition: transform .12s ease, border-color .12s ease;
}
.opt.l-A { background: var(--a-bg); } .opt.l-C { background: var(--c-bg); }
.opt.l-D { background: var(--d-bg); } .opt.l-O { background: var(--o-bg); }
.opt.l-F { background: var(--f-bg); } .opt.l-G { background: var(--g-bg); }
.opt.l-T { background: var(--t-bg); } .opt.l-S { background: var(--s-bg); }
.opt:active { transform: scale(.98); }
.opt.picked { border-color: var(--fg); }
.hint { color: var(--muted); font-size: 15px; margin: 18px 0 0; }

/* 호스트 참고용 안내 화면 */
.interlude {
  margin-top: 28px;
  background: var(--f-bg);
  color: var(--f-ink);
  border-radius: 22px;
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.interlude h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(25px, 7vw, 30px); line-height: 1.35; margin: 0; text-wrap: balance; }
.interlude p { margin: 0; color: var(--fg); }
.interlude .btn-main { margin-top: 10px; }

/* 결과 화면 */
.result { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.rcard { display: flex; flex-direction: column; gap: 11px; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 16px 18px 14px; }
.rhead { display: flex; }
.rhead .tag { font-size: 14px; padding: 1px 12px; }
.rfoot { margin: 0; padding-top: 9px; border-top: 1.5px dashed var(--line); color: var(--muted); font-size: 13px; line-height: 1.4; }
.hint.capture { margin: 0; text-align: center; font-size: 14px; }
.eyebrow { font-family: var(--font-display); color: var(--muted); font-size: 16px; line-height: 1.3; margin: 0; }
.code { display: flex; gap: 6px; }
.code span {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(30px, 9.5vw, 42px);
  line-height: 1;
  padding: 9px 0 8px;
  border-radius: 14px;
}
.rname { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 8vw, 32px); line-height: 1.15; margin: 0; text-wrap: balance; }
.rdesc { margin: 0; font-size: 15px; line-height: 1.5; }
.tally { display: flex; flex-direction: column; gap: 7px; }
.edge { margin: 14px 0 0; font-size: 13px; line-height: 1.6; opacity: .8; }
.picks { display: flex; flex-direction: column; gap: 6px; }
.picks .sec-title { margin: 0; font-size: 15px; }
.picks .dist { gap: 6px; }
.picks .chip { font-size: 14px; padding: 3px 11px; line-height: 1.4; }
.picks .tip { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.row { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 5.6em; align-items: center; gap: 8px; font-size: 14px; }
.row .side { font-family: var(--font-display); font-size: 14px; white-space: nowrap; }
.row .side:last-child { text-align: right; }
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); }
.split i { display: block; height: 100%; }
.sharebox {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 16px;
  user-select: text;
  -webkit-user-select: text;
}
.actions { display: flex; flex-direction: column; gap: 10px; }
.toast { min-height: 1.5em; text-align: center; color: var(--muted); font-size: 15px; margin: 0; }
.status { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }

/* 호스트 전용 모아보기 */
.hostview { display: flex; flex-direction: column; gap: 22px; margin-top: 22px; }
.hostview h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.25; margin: 0; }
.stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--muted); }
.sec-title { font-family: var(--font-display); font-size: 18px; color: var(--muted); margin: 0 0 8px; }
.dist { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 99px; padding: 4px 14px; font-size: 15px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.plist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.person { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.person .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.person .who b { font-family: var(--font-display); font-weight: 400; font-size: 18px; overflow-wrap: anywhere; }
.person .who time { font-size: 13px; color: var(--muted); white-space: nowrap; }
.person .tp { font-size: 16px; }
.person .tp em { font-style: normal; font-family: var(--font-display); color: var(--accent); margin-right: 6px; }
.person .hh { font-size: 14px; color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px; padding: 16px; margin: 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field .fl { font-family: var(--font-display); font-size: 18px; }
.field input { font: inherit; font-size: 18px; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0; box-sizing: border-box; }
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.field .fieldhint { color: var(--accent); font-size: 14px; min-height: 1.3em; }

@media (prefers-reduced-motion: reduce) {
  .bar i, .opt { transition: none; }
}

.brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 22px 0 4px; color: var(--muted); }
.brand .logo { height: 44px; width: auto; flex: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--accent); line-height: 1.2; }
.brand span { font-size: 13px; }
.rfoot .brand { margin: 0; justify-content: flex-start; }
</style>

  function brandFoot() {
    return '<div class="brand">' + LOGO + '<div><b>오늘뭐하지?</b><span>' + ACCOUNT + '</span></div></div>';
  }

  var app = document.getElementById("app");
  var answers = [];
  var screen = "intro";
  var isOwner = false;
  var nick = "";
  var unsubHost = null;

  function cap(name) {
    try {
      if (window.claude && typeof window.claude.use === "function") return window.claude.use(name);
    } catch (e) {}
    return Promise.resolve(null);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function header() {
    return '<span class="tag">오늘뭐하지?</span>';
  }

  function leaveHost() {
    if (unsubHost) { try { unsubHost(); } catch (e) {} unsubHost = null; }
  }

  function optClass(l) {
    return "l-" + (HOST_COLOR[l] || l);
  }

  function renderIntro() {
    leaveHost();
    screen = "intro";
    app.innerHTML =
      header() +
      '<h1>취미 MBTI 테스트</h1>' +
      '<p class="sub">나는 어떤 취미를 좋아할까?</p>' +
      '<div class="intro">' +
        '<div class="axes">' +
          '<div class="axis-card ax1"><b>활동성</b><span>몸을 움직이며 vs 가만히 머물며</span></div>' +
          '<div class="axis-card ax2"><b>참여 방식</b><span>직접 해보기 vs 보고 듣고 감상하기</span></div>' +
          '<div class="axis-card ax3"><b>자유도</b><span>내 방식대로 vs 가이드를 따라</span></div>' +
          '<div class="axis-card ax4"><b>이어가기</b><span>여러 가지 체험 vs 꾸준히 지속</span></div>' +
        '</div>' +
        '<p class="note">4가지 선호 경향을 12문항으로 알아보고, 16가지 유형 중 나의 유형을 찾아요. 약 3분 걸려요.</p>' +
        '<button class="btn-main" id="start" type="button">시작하기</button>' +
      '</div>' + brandFoot();
    document.getElementById("start").addEventListener("click", function () {
      answers = [];
      renderStep();
    });
  }

  function renderStep() {
    var i = answers.length;
    if (i >= ITEMS.length) { renderResult(); return; }
    var item = ITEMS[i];
    screen = "quiz";
    var pct = Math.round((i / ITEMS.length) * 100);

    var counter, body;
    if (item.kind === "interlude") {
      counter = "호스트 참고용";
      body =
        '<div class="interlude">' +
          '<h2>지금부터는 호스트 참고용 질문입니다</h2>' +
          '<p>2문항이에요. 유형 결과에는 반영되지 않고, 호스트가 모임에서 얼마나 도울지 정할 때 참고해요.</p>' +
          '<button class="btn-main" id="go" type="button">계속하기</button>' +
        '</div>';
    } else {
      var isHost = item.kind === "host";
      counter = isHost ? "호스트 참고용 " + (i - MAIN_COUNT) + " / " + HOST_Q.length : (i + 1) + " / " + MAIN_COUNT;
      body =
        '<span class="axis-label ' + (isHost ? 'l-F' : 'l-' + AXES[item.axis].a) + '">' + (isHost ? "호스트 참고용" : AXES[item.axis].name) + '</span>' +
        '<h2 class="q">' + esc(item.text) + '</h2>' +
        '<div class="opts">' +
          '<button class="opt ' + optClass(item.left.l) + '" type="button" data-l="' + item.left.l + '">' + esc(item.left.t) + '</button>' +
          '<button class="opt ' + optClass(item.right.l) + '" type="button" data-l="' + item.right.l + '">' + esc(item.right.t) + '</button>' +
        '</div>' +
        '<p class="hint">' + (isHost ? '모임에서 호스트가 참고하기 위한 문항입니다.' : '취미를 할 때를 떠올리며 골라 주세요.<br>둘 다 좋을 땐 요즘의 나에게 조금 더 가까운 쪽을 골라 주세요.') + '</p>';
    }

    app.innerHTML =
      header() +
      '<div class="topbar"><span class="count">' + counter + '</span>' +
      '<button class="btn-ghost" id="back" type="button"' + (i === 0 ? ' disabled' : '') + '>이전 문항</button></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      body;

    document.getElementById("back").addEventListener("click", function () {
      answers.pop();
      renderStep();
    });

    var go = document.getElementById("go");
    if (go) {
      go.addEventListener("click", function () {
        answers.push("-");
        renderStep();
      });
      return;
    }

    var locked = false;
    var opts = app.querySelectorAll(".opt");
    for (var n = 0; n < opts.length; n++) {
      opts[n].addEventListener("click", function (e) {
        if (locked) return;
        locked = true;
        var btn = e.currentTarget;
        btn.classList.add("picked");
        answers.push(btn.getAttribute("data-l"));
        setTimeout(renderStep, 280);
      });
    }
  }

  function count(letter) {
    var c = 0;
    for (var i = 0; i < MAIN_COUNT; i++) if (answers[i] === letter) c++;
    return c;
  }

  function hostAnswers() {
    return [answers[MAIN_COUNT + 1], answers[MAIN_COUNT + 2]];
  }

  function renderResult() {
    screen = "result";
    var code = "";
    var rows = "";
    ["AC", "DO", "FG", "TS"].forEach(function (k) {
      var A = AXES[k].a, B = AXES[k].b;
      var ca = count(A), cb = count(B);
      code += ca > cb ? A : B;      var total = ca + cb;
      rows +=
        '<div class="row">' +
          '<span class="side" style="color:var(--' + A.toLowerCase() + '-ink)">' + A + ' ' + LABEL[A] + '</span>' +
          '<div class="split" aria-label="' + AXES[k].name + ' ' + A + ' ' + ca + ', ' + B + ' ' + cb + '">' +
            '<i style="width:' + (ca / total * 100) + '%;background:var(--' + A.toLowerCase() + '-ink)"></i>' +
            '<i style="width:' + (cb / total * 100) + '%;background:var(--' + B.toLowerCase() + '-ink)"></i>' +
          '</div>' +
          '<span class="side" style="color:var(--' + B.toLowerCase() + '-ink)">' + B + ' ' + LABEL[B] + '</span>' +
        '</div>';
    });

    var t = TYPES[code];

    try { window.scrollTo(0, 0); } catch (err) {}
    app.innerHTML =
      '<div class="result">' +
        '<div class="rcard" id="rcard">' +
        '<div class="rhead"><span class="tag">오늘뭐하지? 취미 MBTI</span></div>' +
        '<p class="eyebrow">' + esc("나의 취미 유형은") + '</p>' +
        '<div class="code" aria-label="' + code + '">' +
          code.split("").map(function (ch) { return '<span class="l-' + ch + '">' + ch + '</span>'; }).join("") +
        '</div>' +
        '<h1 class="rname">' + esc(t[0]) + '</h1>' +
        '<p class="rdesc">' + esc(t[1]) + '</p>' +
        picksHtml(code) +
        '<div class="tally">' + rows + '</div>' +
        '<div class="rfoot">' + brandFoot() + '</div>' +
        '</div>' +
        '<p class="hint capture">위 카드를 화면 캡처해서 ' + ACCOUNT + ' 로 DM 또는 스토리로 공유해 보세요.</p>' +
        '<div class="actions">' +
          '<button class="btn-ghost" id="again" type="button">다시 해보기</button>' +
        '</div>' +
      '</div>';

    document.getElementById("again").addEventListener("click", function () {
      answers = [];
      renderIntro();
    });

  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.textContent = text;
  }

  // 결과를 호스트가 볼 수 있게 저장한다. 저장은 참여자가 끝까지 풀었을 때 한 번만 하고, 다시 하면 같은 문서를 덮어쓴다.
  async function saveResult(code, h) {
    var NOSAVE = "이 화면에서는 결과가 호스트에게 자동으로 전달되지 않아요. 위 문구를 모임 채팅방에 붙여넣어 주세요.";
    try {
      var db = await cap("db");
      var user = await cap("user");
      if (!db || !user) { setStatus(NOSAVE); return; }
      var id = await user.id();
      if (!id) { setStatus(NOSAVE); return; }
      var allowed = await user.can("data.write");
      if (allowed === false) { setStatus(NOSAVE); return; }
      await db.doc("results/" + id).set({
        code: code,
        nick: nick,
        h1: h[0] || "",
        h2: h[1] || "",
        at: new Date().toISOString()
      });
      setStatus("호스트에게 결과가 전달됐어요.");
    } catch (e) {
      setStatus(NOSAVE);
    }
  }

  // 호스트 전용: 저장된 결과를 실시간으로 모아 보여준다. 이름은 저장하지 않고 id로 불러온다.
  async function renderHost() {
    leaveHost();
    screen = "host";
    app.innerHTML =
      header() +
      '<div class="topbar"><span class="count">호스트 보기</span><button class="btn-ghost" id="hback" type="button">처음으로</button></div>' +
      '<div class="hostview" id="hostbody"><p class="empty">결과를 불러오는 중이에요.</p></div>';
    document.getElementById("hback").addEventListener("click", renderIntro);

    var db = await cap("db");
    var user = await cap("user");
    var body = document.getElementById("hostbody");
    if (!body || screen !== "host") return;
    if (!db) {
      body.innerHTML = '<p class="empty">이 화면에서는 저장된 결과를 불러올 수 없어요. 링크를 claude.ai에서 열어 주세요.</p>';
      return;
    }

    unsubHost = db.collection("results").onSnapshot(function (snap) {
      drawHost(snap.docs, user);
    }, function () {
      var b = document.getElementById("hostbody");
      if (b) b.innerHTML = '<p class="empty">결과를 불러오지 못했어요. 잠시 뒤에 다시 열어 주세요.</p>';
    });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  async function drawHost(docs, user) {
    var rows = docs.map(function (d) {
      var v = d.data() || {};
      return { id: d.id, nick: String(v.nick || "").slice(0, 20), code: String(v.code || ""), h1: String(v.h1 || ""), h2: String(v.h2 || ""), at: String(v.at || "") };
    }).filter(function (r) { return TYPES[r.code]; });
    rows.sort(function (a, b) { return a.at < b.at ? 1 : -1; });

    var names = {};
    if (user && rows.length) {
      try { names = await user.profiles(rows.map(function (r) { return r.id; })); } catch (e) { names = {}; }
    }
    var body = document.getElementById("hostbody");
    if (!body || screen !== "host") return;
    body.textContent = "";

    var title = el("h2", "", "참여자 결과");
    body.appendChild(title);

    if (!rows.length) {
      body.appendChild(el("p", "empty", "아직 저장된 결과가 없어요. 참여자가 claude.ai에 로그인한 상태로, 편집 가능(Contributor) 권한으로 링크를 열어 끝까지 풀면 여기에 쌓여요."));
      return;
    }

    var asst1 = rows.filter(function (r) { return r.h1 === "ASSISTED"; }).length;
    var asst2 = rows.filter(function (r) { return r.h2 === "ASSISTED"; }).length;

    var stats = el("div", "stat-row");
    var s1 = el("div", "stat"); s1.appendChild(el("b", "", rows.length + "명")); s1.appendChild(el("span", "", "결과를 보낸 참여자"));
    var s2 = el("div", "stat"); s2.appendChild(el("b", "", asst1 + " / " + asst2)); s2.appendChild(el("span", "", "도움 받기 선호 (질문 1 / 질문 2)"));
    stats.appendChild(s1); stats.appendChild(s2);
    body.appendChild(stats);

    var tally = {};
    rows.forEach(function (r) { tally[r.code] = (tally[r.code] || 0) + 1; });
    var secD = el("div");
    secD.appendChild(el("p", "sec-title", "유형 분포"));
    var dist = el("div", "dist");
    Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a] || (a < b ? -1 : 1); }).forEach(function (c) {
      dist.appendChild(el("span", "chip", c + " " + TYPES[c][0] + " · " + tally[c] + "명"));
    });
    secD.appendChild(dist);
    body.appendChild(secD);

    var secL = el("div");
    secL.appendChild(el("p", "sec-title", "참여자별"));
    var ul = el("ul", "plist");
    rows.forEach(function (r) {
      var li = el("li", "person");
      var who = el("div", "who");
      var p = names[r.id];
      who.appendChild(el("b", "", r.nick || (p && p.name) || "이름 없는 참여자"));
      var time = el("time", "");
      var d = new Date(r.at);
      time.textContent = isNaN(d.getTime()) ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      who.appendChild(time);
      li.appendChild(who);
      var tp = el("div", "tp");
      tp.appendChild(el("em", "", r.code));
      tp.appendChild(document.createTextNode(TYPES[r.code][0]));
      li.appendChild(tp);
      li.appendChild(el("div", "hh", "참고: " + (HOST_LABEL[r.h1] || "-") + " / " + (HOST_LABEL[r.h2] || "-")));
      ul.appendChild(li);
    });
    secL.appendChild(ul);
    body.appendChild(secL);
  }

  renderIntro();

  // 호스트(소유자)에게만 결과 모아보기 버튼을 보여준다.
  cap("user").then(function (u) {
    if (!u) return null;
    return u.isOwner();
  }).then(function (owner) {
    if (owner) {
      isOwner = true;
      if (screen === "intro") renderIntro();
    }
  }).catch(function () {});
})();
</script>
